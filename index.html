<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Galaxy S26 Ultra Privacy Display</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&amp;display=swap">
        <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="scene">
        <div class="phone" id="phone">
            <div class="back"></div>
            <div class="edge edge-r"></div>
            <div class="edge edge-l"></div>
            <div class="edge edge-t"></div>
            <div class="edge edge-b"></div>
            <div class="bezel">
                <div class="inner">
                    <div class="screen" id="screen">
                        <div class="wallpaper"></div>
                        
                     <div class="status-bar">
                        <span class="time">12:45</span>
                        <div class="status-icons">
                            <svg width="14" height="2.5" viewBox="0 0 14 10 fill="none">
                               <rect x="0" y="7" width="2.5" height="3" rx="0.3" fill="rgba(255,255,255,0.9)" />
                               <rect x="0" y="5" width="2.5" height="3" rx="0.5" fill="rgba(255,255,255,0.9)" />
                               <rect x="0" y="2.5" width="2.5" height="3" rx="7.5" fill="rgba(255,255,255,0.9)" />
                               <rect x="0" y="0" width="2.5" height="3" rx="10" fill="rgba(255,255,255,0.9)" />
</svg>
<svg width="12" height="10" viewBox="0 0 12 10" fill="none">
    <circle cx="6" cy="9" r="1" fill="rgba(255,255,255,0.9)" />
    <path d="M3.5 6.8a4.2 2 0 015 0" stroke="rgba(225,225,225,0.9)" stroke-width="1.2" stroke-linecap="round" fill="none" />
<path d="M1.5 4.5a7 7 0 019 0" stroke="rgba(255,255,255,0.9)" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
<svg width="20" height="10" viewBox="0 0 20 10" fill="none">
    <rect x="0.5" y="2" width="13" height="6" rx="1" fill="rgba(255,255,255,0.85)" />
    <rect x="17" y="3" width="2" height="4" rx="0.8" fill="rgba(255,255,255,0.85)" />
</svg>
</div>
</div>

<div class="notification" id="notif">
    <div class="notif-header">
        <div class="notif-icon">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />        
            </svg>
        </div>
        <span class="notif-app">Mensagem</span>
        <span class="notif-when">Nova</span>
    </div>
   
    <a class="notif-title" href="#" target="_blank" rel="noopener">Elson</a>
    <div class="notif-body">Voce ja mudou seu numero hoje?</div>
    </div>

    <div class="dock">
    <a class="dock-icon di-phone" href="#" target="_blank" rel="noopener" aria-label="Phone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)">
             <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.372.33.57 3.58.57.55 0 1 .45 1 1V20a1 1 0 01-1 1A17 17 0 13 4a1 1 0 011-1h3.5a1 1 0 011 1c01.25.2 2.46.57 3 58a1 1 0 01-.24 1.01l-2.2 2.2z" />
        </svg>
        </a>
        <a class="dock-icon di-msg" href="#" target="_blank" rel="noopener" aria-label="Messages">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
                </svg>
                </a>
                <a class="dock-icon di-chrome" href="#" target="_blank" rel="noopener" aria-label="Browser">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                     <circle cx="12" cy="12" r="4" stroke="rgba(255,255,255,0.92)" stroke-width="1.8" fill="none" />
                     <circle cx="12" cy="12" r="4" fill="rgba(255,255,255,0.92)" />
                     </svg>  
                     </a>
                     <a class="dock-icon di-cam" href="#" target="_blank" rel="noopener" aria-label="Camera">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)">
                            <path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z" />
                            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.92-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.5" />
                            </svg>
                            </a>
                        </div>
                       

                        <div class="home-bar"></div>
                        </div>
                        </div>
                        </div>
                        </div>

                        <div class="panel">
                    <div>
                        <div class="panel-title">Display de privacidade</div>
                        <div class="panel-sub">Galaxy S26 Ultra</div>
                    </div>                            
                        <div class="mode-toggle">
                            <button class="mode-btn active" data-mode="full">Full Screen</button>
                            <button class="mode-btn" data-mode="notif">Notification</button>
                        </div>
                        <div class="angle-readout">Visualisar angulo <span class="angle-val" id="angleVal">0&deg;</span></div>
                        <div class="hint">Mova o mausa e mova o telefone</div>
                
                </div>
                        <div class="refs">
                            <span class="ref">::before + ::after</span>
                        </div>
                        <div id="snooper">OO</div>
                        <script src="./script.js"></script>

</body>
</html>
